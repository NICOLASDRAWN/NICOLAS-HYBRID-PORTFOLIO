<html lang="es">
<head>

  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-M3CTP538');</script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gourmet Bistro | Menú Digital NFC</title>
  
  <meta name="description" content="Menú digital interactivo de Gourmet Bistro. Diseñado para lectura instantánea vía Tags NFC en mesa con pedidos en tiempo real." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>" />
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M3CTP538"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <!-- Top Bar & Table Indicator -->
  <header class="bistro-header">
    <div class="header-container">
      <div class="bistro-brand">
        <a href="../../index.html" class="back-link" title="Volver al Portafolio">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <div>
          <h1 class="brand-title">GOURMET BISTRO</h1>
          <span class="brand-subtitle">Haute Cuisine & Wine Bar</span>
        </div>
      </div>

      <div class="header-actions">
        <div class="nfc-badge">
          <span class="pulse-dot"></span>
          <span>Mesa #07 • NFC Activo</span>
        </div>

        <button class="cart-toggle-btn" id="openCartBtn" aria-label="Ver comanda">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="cart-counter" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Promo Banner -->
  <section class="bistro-hero">
    <div class="hero-content">
      <span class="chef-tag">⭐ Sugerencia del Sommelier</span>
      <h2>Cena Maridaje de Temporada</h2>
      <p>Platos de autor preparados con ingredientes orgánicos locales y vinos seleccionados.</p>
    </div>
  </section>

  <!-- Menu Navigation Filters -->
  <div class="menu-nav-wrapper">
    <div class="menu-nav">
      <button class="menu-tab active" data-category="todos">Todo el Menú</button>
      <button class="menu-tab" data-category="entradas">Entradas</button>
      <button class="menu-tab" data-category="fuertes">Platos Fuertes</button>
      <button class="menu-tab" data-category="vinos">Vinos & Cocteles</button>
      <button class="menu-tab" data-category="postres">Postres</button>
    </div>
  </div>

  <!-- Menu Dishes Grid -->
  <main class="menu-container">
    <div class="dishes-grid" id="dishesGrid">
      <!-- Injected dynamically via app.js -->
    </div>
  </main>

  <!-- Floating Call Waiter Button -->
  <button class="btn-call-waiter" id="callWaiterBtn" title="Llamar al mesero">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <span>Llamar al Mesero</span>
  </button>

  <!-- Slide-out Cart Drawer -->
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Tu Pedido en Mesa #07</h3>
      <button class="cart-close" id="closeCartBtn">&times;</button>
    </div>

    <div class="cart-items" id="cartItemsContainer">
      <!-- Items dynamically added -->
      <div class="cart-empty-state">Tu comanda está vacía. Añade platos desde el menú.</div>
    </div>

    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Total:</span>
        <strong id="cartTotalPrice">$0.00</strong>
      </div>
      <button class="btn-send-order" id="sendOrderBtn">
        <span>Enviar Pedido a Cocina</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>
  <div class="cart-backdrop" id="cartBackdrop"></div>

  <script src="app.js"></script>
</body>
</html>
